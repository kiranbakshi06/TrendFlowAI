      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - date:
          TYPE: DATE
          LOCATION: query
      - target:
          TYPE: STRING
          LOCATION: query
      - output:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
    RETURNS:
      - RETURNTYPE: STRUCT(site-explorer.domain-rating)
        RETURNVAR: ahrefs_site-explorer_domainRating_list
