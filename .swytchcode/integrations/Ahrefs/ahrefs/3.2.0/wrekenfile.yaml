  api.brand-radar.aiResponses.createRequest:
    - name: brand_filter
      type: OBJECT
      REQUIRED: false
      comment: |-
        A filter expression for your brand's visibility, mirroring the "Your brand" filter. `brand_name` matches whether a response mentions your brand: `"mentioned"` or `"not_mentioned"`. `page_status` matches how the AI used your pages: `"cited"` (the AI retrieved pages from your site and referenced them in the answer), `"found_but_not_cited"` (the AI retrieved pages from your site as potential sources but did not reference them in the final answer), or `"not_found"` (the AI did not retrieve any pages from your site).
        Uses [filter syntax](https://docs.ahrefs.com/api/docs/filter-syntax) with the following restrictions: the only valid operator is `"eq"`; each field is one section: give a single value, or combine several values of the same field with `or`; join the `brand_name` and `page_status` sections with a top-level `and`/`or`. Selecting every value of a field is rejected, since it matches everything (omit the field instead).
    - name: volume_range
      type: OBJECT
      REQUIRED: false
      comment: The volume range to filter by.
    - name: select
      type: "[]STRING"
      REQUIRED: true
      comment: |-
        A list of fields to return.

        - `country`
        - `data_source`
        - `last_updated`
        - `links` (10 units)
        - `question`
        - `response`
        - `search_queries`
        - `tags`
        - `volume` (10 units)
    - name: where
      type: OBJECT
      REQUIRED: false
      comment: |-
        The filter expression. The following column identifiers are recognized (this differs from the identifiers recognized by the `select` parameter).

        **cited_domain**: The domain of a page that was used to generate the response.
        type: domain

        **cited_domain_subdomains**: The domain of a page that was used to generate the response. Any subdomain of the given domain will also match.
        type: string

        **cited_url_exact**: The URL of a page that was used to generate the response.
        type: string

        **cited_url_prefix**: The URL of a page that was used to generate the response. Any URL that starts with this prefix will match.
        type: string

        **question**: The question asked by the user. Note: the `substring` and `isubstring` operators are not supported on this field; use `phrase_match` or `iphrase_match` instead.
        type: string

        **response** (10 units): The response from the model. Note: the `substring` and `isubstring` operators are not supported on this field; use `phrase_match` or `iphrase_match` instead.
        type: string

        **search_queries**: The search query used by the chatbot to find information for the response. Note: if `data_source` does not include `chatgpt` or `perplexity`, this field will always be empty.
        type: string

        **topic**: The topic of the query.
        type: string
    - name: tags_filter
      type: OBJECT
      REQUIRED: false
      comment: "A filter expression for prompt tags. Requires `report_id`. Uses [filter syntax](https://docs.ahrefs.com/api/docs/filter-syntax) with the following restrictions: the only valid field name is `\"tag\"`; the only valid operator are: `\"eq\"`, `\"neq\"`, `\"substring\"`, `\"isubstring\"`, `\"phrase_match\"`, `\"iphrase_match\"`, `\"prefix\"`, `\"suffix\"`, `\"empty\"`; maximum nesting depth of `and`, `or` is 2."
    - name: limit
      type: INT
      REQUIRED: false
      comment: The number of results to return.
    - name: date
      type: DATE
      REQUIRED: false
      comment: The date to search for in YYYY-MM-DD format.
    - name: search_volume_type
      type: STRING
      REQUIRED: false
      comment: |-
        AI visibility reports are switching to AI adjusted volume. It better estimates demand for AI responses across chatbots and AI search surfaces. It is calculated by adjusting Google search volume for each AI platform’s estimated usage compared with Google. This param will be deprecated on August 31, 2026; all requests will use new AI adjusted volume.

        `ask_volume` - New calculation (default). Estimates demand for AI responses by adjusting Google search volume for each AI platform.

        `keyword_volume` - Previous calculation. Uses Google search volume without AI platform adjustment. Available until August 31, 2026.
    - name: country
      type: "[]STRING"
      REQUIRED: false
      comment: A list of two-letter country codes (ISO 3166-1 alpha-2).
    - name: order_by
      type: STRING
      REQUIRED: false
      comment: A column to order the results by.
    - name: report_id
      type: STRING
      REQUIRED: false
      comment: "The ID of the report to use. If one is given, other parameters are taken from the report (brand, competitors, market, country, filters). If country or filters are provided, they override the ones in the report. You can find it in the URL of your Brand Radar report in Ahrefs: `https://app.ahrefs.com/brand-radar/reports/#report_id#/...`"
    - name: prompts
      type: STRING
      REQUIRED: false
      comment: The type of prompts to use. If not specified, both will be used. Custom prompts require a report_id to be provided.
    - name: data_source
      type: "[]STRING"
      REQUIRED: true
      comment: |-
        A list of chatbot models. All models can be combined with each other. `claude` module supports only custom prompts.
        The `google_ai_overviews_keywords` and `google_ai_mode_keywords` models report AI Overviews / AI Mode visibility derived from Google search queries (keywords) rather than prompts.
    - name: market
      type: "[]STRING"
      REQUIRED: false
      comment: A list of the niche markets of your brands. Deprecated on 2026-05-18, this parameter will have no effect shortly after this date.
    - name: competitors
      type: "[]STRUCT(brand-radar.entity)"
      REQUIRED: false
      comment: A list of competitor names and websites to search for.
    - name: brands
      type: "[]STRUCT(brand-radar.entity)"
      REQUIRED: false
      comment: A list of brand names and websites to search for.
    - name: output
      type: STRING
      REQUIRED: false
      comment: The output format.
